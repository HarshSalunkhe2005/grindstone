name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        shell: bash
        run: |
          if ! npm ci > /tmp/ci.log 2>&1; then
            echo "::error::$(head -c 1200 /tmp/ci.log | tr '\n' ' ' | tr -d '%')"
            exit 1
          fi
      - run: npx tsc --noEmit
      - run: npx eslint src tests
      - run: npx vitest run
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
