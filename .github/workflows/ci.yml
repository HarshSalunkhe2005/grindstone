name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The lockfile is written by npm 11; match it so `npm ci` agrees with the lock.
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src tests
      - run: npx vitest run
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
